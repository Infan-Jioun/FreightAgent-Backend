name: CI/CD Pipeline - From Commit to AWS Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # STEP 3 & 4: BUILD & TEST (Continuous Integration)
  # ============================================================================
  ci-pipeline:
    name: 1. Continuous Integration (Build & Test)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Code Checkout
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. Generate Prisma Client
        run: npx prisma generate

      - name: 5. Run Type Check (Test Stage)
        run: npx tsc --noEmit

      - name: 6. Build Application (Build Stage)
        run: npm run build

  # ============================================================================
  # STEP 5 & 6: PACKAGE DOCKER & PUSH TO DOCKER HUB
  # ============================================================================
  docker-delivery:
    name: 2. Docker Package & Push to Docker Hub
    needs: ci-pipeline
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 1. Code Checkout
        uses: actions/checkout@v4

      - name: 2. Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: 3. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 5. Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/freightagent-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 6. Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # STEP 7 & 8: DEPLOY TO AWS & RUN CONTAINER (Continuous Deployment)
  # ============================================================================
  aws-deployment:
    name: 3. Deploy to AWS Server (Docker Container)
    needs: docker-delivery
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 1. Copy docker-compose.prod.yml to AWS Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/freightagent-backend/"

      - name: 2. Execute Deployment Script on AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/freightagent-backend

            echo " Pulling latest Docker image from Docker Hub..."
            export DOCKER_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/freightagent-backend:latest"
            docker pull $DOCKER_IMAGE

            echo " Applying database migrations (Prisma)..."
            docker compose -f docker-compose.prod.yml run --rm backend npx prisma migrate deploy || true

            echo " Restarting container with zero downtime..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo " Cleaning up legacy unused images..."
            docker image prune -af --filter "until=24h"

            echo " Checking running containers..."
            docker ps --filter "name=freightagent-backend"

